name: Register Discord Command

# One-time setup helper. Run it manually from the Actions tab.
# Needs two repo secrets: DISCORD_APP_ID and DISCORD_BOT_TOKEN.

on:
  workflow_dispatch: {}

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register /ask
        run: |
          curl -sS -X POST \
            "https://discord.com/api/v10/applications/${{ secrets.DISCORD_APP_ID }}/commands" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "ask",
              "description": "Ask the market intel bot a question",
              "options": [{
                "type": 3,
                "name": "question",
                "description": "What do you want to know?",
                "required": false
              }]
            }' | tee response.json
          grep -q '"id"' response.json && echo "Command registered." || (echo "Registration failed - check secrets."; exit 1)
