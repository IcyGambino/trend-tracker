name: Register Discord Command

# One-time setup helper. Run it manually from the Actions tab.
# Needs two repo secrets: DISCORD_APP_ID and DISCORD_BOT_TOKEN.
# Safe to re-run: registering again just overwrites the same commands.

on:
  workflow_dispatch: {}

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register /ask
        run: |
          curl -sS -X POST \
            "https://discord.com/api/v10/applications/${{ secrets.DISCORD_APP_ID }}/commands" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "ask",
              "description": "Ask the market intel bot a question",
              "options": [{
                "type": 3,
                "name": "question",
                "description": "What do you want to know?",
                "required": false
              }]
            }' | tee ask.json
          grep -q '"id"' ask.json && echo "/ask registered." || (echo "/ask registration failed."; exit 1)

      - name: Register /ticker
        run: |
          curl -sS -X POST \
            "https://discord.com/api/v10/applications/${{ secrets.DISCORD_APP_ID }}/commands" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "ticker",
              "description": "Deep dive on a single ticker with recent news",
              "options": [{
                "type": 3,
                "name": "symbol",
                "description": "Ticker symbol, e.g. NVDA",
                "required": true
              }]
            }' | tee ticker.json
          grep -q '"id"' ticker.json && echo "/ticker registered." || (echo "/ticker registration failed."; exit 1)
