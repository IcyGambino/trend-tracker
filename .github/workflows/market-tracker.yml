name: Market Trend Tracker
# Relay design: GitHub caps jobs at 6h, and a full session (pre-open -> 3:00 PM
# CT close) is longer than that. So two loop runs relay: the morning leg covers
# the open until ~12:45 PM CT, then exits; the afternoon kicker (queued behind
# it by the concurrency group) takes over and covers through the close.
# Multiple kicker crons give redundancy against GitHub skipping a tick; any
# extras just queue and exit in seconds once they see the session is closed.

on:
  schedule:
    # Morning kickers ~7:15-7:45 AM CT (CDT; +1h in CST). GitHub lag of
    # 30-60 min lands the start near the 8:30 CT open. Duplicates queue
    # and no-op.
    - cron: "15,45 12 * * 1-5"
    # Afternoon relay kickers ~12:30-1:00 PM CT. These queue behind the
    # morning leg and take over when it exits.
    - cron: "30 17 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-trend-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # hard safety net under GitHub's 6h cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Loop tracker until handoff or close
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          persist_state() {
            [[ -z "$(git status --porcelain state.json)" ]] && return 0
            cp state.json /tmp/state.json
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              cp /tmp/state.json state.json
              git add state.json
              git commit -m "Update trend state [skip ci]" || return 0
              git push && return 0
              echo "push retry $attempt"
            done
          }

          START=$(date +%s)
          MAX_RUNTIME=$(( 60 * 285 ))          # each leg runs at most 4h45m
          MORNING_LEG=0
          # If we started before 17:15 UTC (~12:15 PM CT in CDT), we're the
          # morning leg: we exit at 17:45 UTC so the queued afternoon leg
          # takes over cleanly.
          if [ "$(date -u +%H%M)" -lt "1715" ]; then
            MORNING_LEG=1
          fi

          while true; do
            python tracker.py || true
            persist_state || true

            NOW_HM=$(date -u +%H%M)
            # Past close (16:00 ET = 20:00 UTC EDT / 21:00 UTC EST) plus
            # buffer -> done for the day.
            if [ "$NOW_HM" -gt "2105" ]; then
              echo "Past close - exiting."
              break
            fi
            # Morning leg hands off at 17:45 UTC (~12:45 PM CT in CDT).
            if [ "$MORNING_LEG" = "1" ] && [ "$NOW_HM" -gt "1745" ]; then
              echo "Morning leg handing off to afternoon relay."
              break
            fi
            # Runtime safety: exit before GitHub's cap; a queued kicker resumes.
            if [ $(( $(date +%s) - START )) -gt "$MAX_RUNTIME" ]; then
              echo "Max leg runtime reached - exiting for relay."
              break
            fi
            sleep 300
          done
