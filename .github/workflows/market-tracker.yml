name: Market Trend Tracker
# Self-looping runner: one job wakes at the open and re-runs tracker.py every
# 5 minutes until the close, so posts don't depend on GitHub's cron firing on
# time. A daily cron kicks it off; you can also start it manually any time.

on:
  schedule:
    - cron: "0,30 13 * * 1-5"   # ~9:00 & 9:30 ET kickers (belt and suspenders)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-trend-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # covers a full session; GitHub hard-caps jobs at 6h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Loop tracker every 5 minutes until close
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          persist_state() {
            [[ -z "$(git status --porcelain state.json)" ]] && return 0
            cp state.json /tmp/state.json
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              cp /tmp/state.json state.json
              git add state.json
              git commit -m "Update trend state [skip ci]" || return 0
              git push && return 0
              echo "push retry $attempt"
            done
          }

          # Loop for the session. tracker.py self-gates to ET market hours,
          # so ticks before 9:30 / after 16:00 just print "market closed".
          END=$(( $(date +%s) + 60*60*7 ))   # run up to 7h; timeout-minutes also guards
          while [ "$(date +%s)" -lt "$END" ]; do
            python tracker.py || true
            persist_state || true

            # Stop early once we're clearly past the close (21:05 UTC = 16:05 ET EDT / covers EST too)
            HM=$(date -u +%H%M)
            if [ "$HM" -gt "2110" ]; then
              echo "Past close - exiting loop."
              break
            fi
            sleep 300
          done
