name: Market Trend Tracker
# v2 - re-committed 2026-08-12 to re-register the cron schedule.

on:
  schedule:
    # Every 5 min through the US session, every trading day (Mon-Fri).
    # 13:00-21:55 UTC covers 9:30-16:00 ET in both EDT and EST;
    # the script itself re-checks ET hours and skips off-hours,
    # so the extra UTC padding never causes stray posts.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-trend-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracker
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tracker.py

      - name: Persist state
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep our fresh reading, commit it on top of whatever the remote
          # has. If another run pushed first, re-sync and reapply.
          # "latest read wins" - no interactive merge, so it can never wedge.
          cp state.json /tmp/state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/state.json state.json
            git add state.json
            git commit -m "Update trend state [skip ci]" || { echo "Nothing to commit."; exit 0; }
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - remote moved, retrying."
          done
          echo "Could not push state after retries - next run will refresh it."
          exit 0
