name: Market Briefings

# Morning brief ~7:00 AM Central, close recap ~3:10 PM Central.
# Cron is UTC; pairs cover both CDT (UTC-5) and CST (UTC-6). The script
# windows itself in Central Time, so the off-season cron of each pair
# lands outside the window and skips harmlessly.

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 7:00 CT during CDT
    - cron: "0 13 * * 1-5"   # 7:00 CT during CST (CDT: 8:00 CT - still in morning window... skipped, window ends 8:15; acts as backup)
    - cron: "10 20 * * 1-5"  # 3:10 PM CT during CDT
    - cron: "10 21 * * 1-5"  # 3:10 PM CT during CST
  workflow_dispatch:
    inputs:
      mode:
        description: "Force a mode (morning or close); leave blank for auto"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: market-briefings
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post briefing
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODE: ${{ github.event.inputs.mode }}
        run: python briefing.py
